plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mtstyle.fm'
    compileSdk 34

    defaultConfig {
        applicationId "com.mtstyle.fm"
        minSdk 26
        targetSdk 34
        versionCode 107
        versionName "5.9.56"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // jadx 等第三方 jar 自带的元数据文件互相重复，排除以避免打包冲突
    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES',
                         'META-INF/*.txt', 'META-INF/maven/**', 'META-INF/versions/**']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.annotation:annotation:1.6.0'

    // 「转 Java」：jadx-core 1.5.1 + dex 输入插件 + guava/gson/slf4j（app/libs 本地 jar，离线集成）
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

// kotlin-stdlib 1.8+ 已合并 jdk7/jdk8 内容，排除这两个空壳模块以避免重复类
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    // guava 已内置 ListenableFuture，排除同名空壳模块避免重复类
    exclude group: 'com.google.guava', module: 'listenablefuture'
}
